name: Daily Ferry Forecast

on:
  schedule:
    # UTC 22:30 = JST 07:30 (日本時間 朝7:30に自動実行)
    - cron: '30 22 * * *'
  workflow_dispatch: # GitHub画面からの手動実行ボタン

jobs:
  run-forecast:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas bs4 scikit-learn

      - name: Run main script
        run: |
          python main.py

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add ferry_data.sqlite
          git diff-index --quiet HEAD || git commit -m "Auto update ferry forecast [skip ci]"
          git push
