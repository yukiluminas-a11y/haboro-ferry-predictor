name: Daily Ferry Forecast Auto-Learner

on:
  schedule:
    - cron: '30 21 * * *'
    - cron: '30 4 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Python環境のセットアップ
        uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.12'

      - name: 依存ライブラリのインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 予測＆学習スクリプトの実行
        run: python main.py

      - name: 変更データを自動コミット＆プッシュ
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "変更はありません。"
          else
            git commit -m "Auto update forecast & learning data [skip ci]"
            git push origin main
          fi

      - name: Pages ページのアップロード
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: GitHub Pages へデプロイ
        id: deployment
        uses: actions/deploy-pages@v4
