name: Run Ferry Forecast & Scraping Workflow

on:
  schedule:
    # 毎日 日本時間(JST) 朝9:15 に自動実行 (UTC 前日24:15 = 当日0:15)
    - cron: '15 0 * * *'
  workflow_dispatch: # GitHubの画面から「Run workflow」でいつでも手動実行可能

jobs:
  forecast:
    runs-on: ubuntu-latest

    permissions:
      contents: write # データベースやindex.htmlを書き込み（コミット）する権限

    steps:
    # 1. リポジトリの最新コードを取得
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2. Python 3.10 環境をセットアップ
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 3. 必要なライブラリ（scikit-learn, pandas等）を一括インストール
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 4. メイン処理（AI学習・予測・公式実績取得）を実行
    - name: Run main.py
      run: python main.py

    # 5. 更新されたDB（ferry_data.sqlite）とWeb画面（index.html）を自動コミット＆プッシュ
    - name: Commit and Push Changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        # 変更のあったファイルをインデックスに追加
        git add index.html ferry_data.sqlite
        
        # 変更がある場合のみコミットしてプッシュ
        if git diff --staged --quiet; then
          echo "変更されたファイルがないため、コミットをスキップします。"
        else
          git commit -m "Auto-update: Ferry forecast & actual status ($(date +'%Y-%m-%d %H:%M JST'))"
          git push
        fi
