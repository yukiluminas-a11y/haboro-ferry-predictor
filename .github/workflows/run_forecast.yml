name: Daily Ferry Forecast

on:
  schedule:
    # UTC 22:30 = JST 07:30 (日本時間 朝7:30)
    - cron: '30 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-forecast:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas beautifulsoup4 scikit-learn lxml joblib

      - name: Run main script
        run: |
          python main.py

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          # 生成・更新されるすべてのファイルを指定
          git add ferry_data.sqlite ferry_model.pkl index.html
          if ! git diff --staged --quiet; then
            git commit -m "Auto update ferry forecast and HTML [skip ci]"
            git push
          else
            echo "No changes to commit"
          fi
