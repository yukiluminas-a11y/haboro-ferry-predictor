name: Daily Ferry Forecast Auto-Learner

on:
  schedule:
    - cron: '30 21 * * *'
    - cron: '30 4 * * *'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: Python環境のセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 依存ライブラリのインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 予測＆学習スクリプトの実行
        run: python main.py

      - name: 変更データを自動コミット＆プッシュ
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ferry_data.sqlite index.html
          git diff --staged --quiet || (git commit -m "Auto update forecast & learning data [skip ci]" && git push)

      - name: GitHub Pagesへ自動デプロイ
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
