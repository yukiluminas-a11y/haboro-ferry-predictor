name: Daily Ferry Forecast

on:
  schedule:
    # UTC 22:30 = JST 07:30 (日本時間 朝7:30)
    - cron: '30 22 * * *'
  workflow_dispatch:

# リポジトリへの書き込み権限を明示的に付与
permissions:
  contents: write

jobs:
  run-forecast:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas bs4 scikit-learn

      - name: Run main script
        run: |
          python main.py

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add ferry_data.sqlite
          # 変更がある場合のみコミット・Pushを実行
          if ! git diff --staged --quiet; then
            git commit -m "Auto update ferry forecast [skip ci]"
            git push
          else
            echo "No changes to commit"
          fi
