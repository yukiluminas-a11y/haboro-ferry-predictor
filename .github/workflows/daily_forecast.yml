name: Daily Ferry Forecast & Scraping

on:
  schedule:
    # 毎日 日本時間(JST) 朝7:30 に実行 (UTC前日22:30)
    - cron: '30 22 * * *'
  workflow_dispatch: # GitHubの画面から手動でいつでも実行可能

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    permissions:
      contents: write # リポジトリへの書き込み（コミット）権限

    steps:
    # 1. リポジトリのチェックアウト
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2. Python環境のセットアップ
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 3. 依存ライブラリのインストール
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests pandas beautifulsoup4

    # 4. 統合スクリプト (main.py) の実行
    - name: Run main.py
      run: python main.py

    # 5. 更新されたファイル (index.html, DB) を自動コミット＆プッシュ
    - name: Commit and Push Changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        # 変更されたファイルをインデックスに追加
        git add index.html ferry_data.sqlite
        
        # 変更がある場合のみコミット
        if git diff --staged --quiet; then
          echo "変更がないためコミットをスキップします。"
        else
          git commit -m "Auto-update: Ferry forecast & actual records ($(date +'%Y-%m-%d %H:%M JST'))"
          git push
        fi
